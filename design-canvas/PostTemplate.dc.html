<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f4f4f5; font-family: "Geist", system-ui, -apple-system, sans-serif; }
    a { color: #059669; } a:hover { color: #047857; }
    .stage { padding: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .post { width: 500px; height: 500px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 16px 40px rgba(0,0,0,0.10); }
    .photo { flex: 1; background: repeating-linear-gradient(135deg, #e4e4e7, #e4e4e7 10px, #f4f4f5 10px, #f4f4f5 20px); display: flex; align-items: center; justify-content: center; }
    .photo-label { font-size: 13px; font-weight: 600; color: #a1a1aa; letter-spacing: 0.02em; }
    .caption { background: #09090b; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; position: relative; }
    .badge { align-self: flex-start; background: #d1fae5; color: #047857; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
    .pname { font-size: 22px; font-weight: 700; color: #ffffff; }
    .ploc { font-size: 13px; color: #a1a1aa; }
    .mark { position: absolute; right: 22px; bottom: 20px; width: 30px; height: 30px; border-radius: 50%; background: #059669; display: flex; align-items: center; justify-content: center; }
    .caption-note { max-width: 500px; font-size: 11.5px; color: #a1a1aa; line-height: 1.5; }
  </style>
</helmet>
<div class="stage">
  <div class="post">
    <div class="photo"><span class="photo-label">FOTO DEL PROFESIONAL EN SU TRABAJO</span></div>
    <div class="caption">
      <span class="badge">Electricidad</span>
      <span class="pname">Nombre del profesional</span>
      <span class="ploc">Ciudad, Provincia</span>
      <div class="mark">
        <svg width="18" height="18" viewBox="0 0 100 100" fill="none">
          <path d="M6 20 H52" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
          <path d="M29 26 V78" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
          <circle cx="78" cy="30" r="13" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="78" cy="70" r="13" fill="none" stroke="#ffffff" stroke-width="11"/>
        </svg>
      </div>
    </div>
  </div>
  <p class="caption-note">Template para "conocé a nuestros profesionales" — mismo patrón de datos que ya guarda cada perfil (categoría, nombre, ciudad, provincia), así se arma rápido con lo que ya carga cada profesional.</p>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
